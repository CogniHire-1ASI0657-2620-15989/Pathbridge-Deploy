name: pathbridge

# This file expects the service repositories to be sibling directories of
# Pathbridge-Deploy on the deployment host. PostgreSQL is supplied by RDS.
x-rds-ca-volume: &rds_ca_volume ./certs/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro

services:
  gateway:
    build: ../Api-Gateway
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8000
      JOB_DISCOVERY_SERVICE_URL: http://job-discovery-service:8000
      GAP_ANALYSIS_SERVICE_URL: http://gap-analysis-service:8000
      LEARNING_PATHWAY_SERVICE_URL: http://learning-pathway-service:8000
      INTERVIEW_COACH_SERVICE_URL: http://interview-coach-service:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-identity-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-job-platform-services}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_USER_ID_HEADER: X-User-Id
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      identity-service:
        condition: service_healthy
      job-discovery-service:
        condition: service_healthy
      gap-analysis-service:
        condition: service_healthy
      learning-pathway-service:
        condition: service_healthy
      interview-coach-service:
        condition: service_healthy
    networks: [pathbridge]
    healthcheck: &app_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  identity-service:
    build: ../Identity-Service
    environment:
      DATABASE_URL: postgresql+psycopg://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/identity_db?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
      DATABASE_SCHEMA: identity
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-identity-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-job-platform-services}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DECOLECTA_BASE_URL: ${DECOLECTA_BASE_URL:-https://api.decolecta.com}
      DECOLECTA_API_KEY: ${DECOLECTA_API_KEY}
      DECOLECTA_TIMEOUT_SECONDS: ${DECOLECTA_TIMEOUT_SECONDS:-3}
    volumes: [*rds_ca_volume]
    networks: [pathbridge]
    healthcheck: *app_healthcheck

  job-discovery-service:
    build: ../Job-Discovery-Service
    environment:
      DATABASE_URL: postgresql+psycopg://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/job_discovery_db?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
      DATABASE_SCHEMA: job_discovery
      JOOBLE_API_KEY: ${JOOBLE_API_KEY}
      JOOBLE_BASE_URL: ${JOOBLE_BASE_URL:-https://pe.jooble.org/api}
      GATEWAY_USER_ID_HEADER: X-User-Id
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes: [*rds_ca_volume]
    networks: [pathbridge]
    healthcheck: *app_healthcheck

  gap-analysis-service:
    build: ../Gap-Analysis-Service
    environment:
      DATABASE_URL: postgresql+psycopg://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/gap_analysis_db?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
      DATABASE_SCHEMA: gap_analysis
      IDENTITY_SERVICE_URL: http://identity-service:8000
      JOB_DISCOVERY_SERVICE_URL: http://job-discovery-service:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GATEWAY_USER_ID_HEADER: X-User-Id
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      identity-service:
        condition: service_healthy
      job-discovery-service:
        condition: service_healthy
    volumes: [*rds_ca_volume]
    networks: [pathbridge]
    healthcheck: *app_healthcheck

  learning-pathway-service:
    build: ../Learning-Pathway-Service
    environment:
      DATABASE_URL: postgresql+psycopg://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/learning_pathway_db?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
      DATABASE_SCHEMA: learning_pathway
      IDENTITY_SERVICE_URL: http://identity-service:8000
      GAP_ANALYSIS_SERVICE_URL: http://gap-analysis-service:8000
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY}
      GATEWAY_USER_ID_HEADER: X-User-Id
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      identity-service:
        condition: service_healthy
      gap-analysis-service:
        condition: service_healthy
    volumes: [*rds_ca_volume]
    networks: [pathbridge]
    healthcheck: *app_healthcheck

  interview-coach-service:
    build: ../Interview-Coach-Service
    environment:
      DATABASE_URL: postgresql+psycopg://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT:-5432}/interview_coach_db?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
      DATABASE_SCHEMA: interview_coach
      IDENTITY_SERVICE_URL: http://identity-service:8000
      JOB_DISCOVERY_SERVICE_URL: http://job-discovery-service:8000
      GAP_ANALYSIS_SERVICE_URL: http://gap-analysis-service:8000
      LEARNING_PATHWAY_SERVICE_URL: http://learning-pathway-service:8000
      INTERVIEW_GROQ_API_KEY: ${INTERVIEW_GROQ_API_KEY:-}
      INTERVIEW_GROQ_MODEL: ${INTERVIEW_GROQ_MODEL:-qwen/qwen3.8-27b}
      GATEWAY_USER_ID_HEADER: X-User-Id
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      identity-service:
        condition: service_healthy
      job-discovery-service:
        condition: service_healthy
      gap-analysis-service:
        condition: service_healthy
      learning-pathway-service:
        condition: service_healthy
    volumes: [*rds_ca_volume]
    networks: [pathbridge]
    healthcheck: *app_healthcheck

networks:
  pathbridge:
    driver: bridge
